<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem("bex-theme");
        if (t === "light" || t === "dark") {
          var m = document.querySelector('meta[name="color-scheme"]');
          if (m) m.content = t;
          document.documentElement.dataset.theme = t;
        }
        if (!("__TAURI_INTERNALS__" in window)) {
          var rawZoom = localStorage.getItem("bex-ui-zoom");
          if (rawZoom !== null) {
            var parsedZoom = Number.parseFloat(rawZoom);
            if (Number.isFinite(parsedZoom)) {
              var z = Math.round(Math.min(1.8, Math.max(0.7, parsedZoom)) * 100) / 100;
              if (z !== 1) {
                document.documentElement.style.zoom = String(z);
              }
            }
          }
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/bex-bottle.svg" />
    <title>Bex LaTeX Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
