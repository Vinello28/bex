name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create GitHub release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate signing key and derive version from git tag
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing required GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi

          if ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q '^untrusted comment:' \
            && ! printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r\n ' | base64 -d 2>/dev/null | grep -q '^untrusted comment:'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not appear to be a valid Tauri/minisign private key (missing 'untrusted comment:' header)."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null || true)"
          fi

          if [ -z "${TAG_NAME:-}" ]; then
            echo "::error::Release version must be determined from a v* git tag (e.g. v0.2.0). Push a v* tag or run workflow_dispatch from a v* tag."
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Invalid release tag '$TAG_NAME'. Expected SemVer prefixed with 'v' (e.g. v0.2.0 or v0.2.0-beta.1)."
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved release version $VERSION from tag $TAG_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install macOS dependencies for Tectonic
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config icu4c harfbuzz freetype graphite2 fontconfig openssl@3
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:/usr/local/opt/openssl@3/lib/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Linux dependencies for Tauri and Tectonic
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libicu-dev \
            libharfbuzz-dev \
            libharfbuzz-icu0 \
            libfreetype6-dev \
            libgraphite2-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Cache Windows vcpkg dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/vcpkg
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Build Windows vcpkg dependencies for Tectonic
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri
        run: |
          if (-not (Get-Command cargo-vcpkg -ErrorAction SilentlyContinue)) {
            cargo install cargo-vcpkg
          }
          cargo vcpkg build
          $vcpkgRoot = Join-Path (Get-Location) "target\vcpkg"
          "TECTONIC_DEP_BACKEND=vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync app version from git tag
        shell: bash
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require("node:fs");

          const version = process.env.RELEASE_VERSION;
          if (!version) {
            throw new Error("RELEASE_VERSION is not set");
          }

          const pkgPath = "package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

          const tauriConfPath = "src-tauri/tauri.conf.json";
          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
          tauriConf.version = version;
          fs.writeFileSync(tauriConfPath, JSON.stringify(tauriConf, null, 2) + "\n");

          const cargoTomlPath = "src-tauri/Cargo.toml";
          const cargoToml = fs.readFileSync(cargoTomlPath, "utf8");
          const updatedCargoToml = cargoToml.replace(
            /^(\[package\][\s\S]*?^version\s*=\s*")[^"]+(")/m,
            `$1${version}$2`
          );
          if (updatedCargoToml === cargoToml && !cargoToml.includes(`version = "${version}"`)) {
            throw new Error("Failed to update [package] version in src-tauri/Cargo.toml");
          }
          fs.writeFileSync(cargoTomlPath, updatedCargoToml);

          console.log(`Synced package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml to version ${version}`);
          EOF

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Bex LaTeX Studio ${{ env.RELEASE_TAG }}"
          releaseBody: |
            See installer downloads and automatic update artifacts below.

            > **macOS note:** Releases are ad-hoc signed without Apple notarization. If macOS says the app is damaged or blocked after downloading, drag **Bex LaTeX Studio.app** into `/Applications` and run:
            > ```bash
            > xattr -dr com.apple.quarantine "/Applications/Bex LaTeX Studio.app"
            > ```
          releaseDraft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true || contains(env.RELEASE_VERSION, '-') }}
          args: ${{ matrix.args }}

      - name: Verify macOS app bundle signature and bundled dylibs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Bex LaTeX Studio.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          BIN_PATH="$APP_PATH/Contents/MacOS/bex-latex-studio"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected macOS app bundle not found at $APP_PATH"
            exit 1
          fi

          shopt -s nullglob
          DYLIBS=("$FRAMEWORKS_DIR"/*.dylib)
          if [ "${#DYLIBS[@]}" -eq 0 ]; then
            echo "::error::No bundled dylibs found inside $FRAMEWORKS_DIR"
            exit 1
          fi

          echo "Bundled dylibs in $FRAMEWORKS_DIR:"
          ls -la "$FRAMEWORKS_DIR"

          if otool -L "$BIN_PATH" "${DYLIBS[@]}" | grep -E '(/opt/homebrew|/usr/local)'; then
            echo "::error::Found unbundled Homebrew/local dylib references in macOS app bundle!"
            exit 1
          fi

          codesign -vvv --deep --strict "$APP_PATH"
