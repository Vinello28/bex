    <path d="M 26.2 19.3 C 25.3 24.3, 14.3 28.0, 14.2 34.5 L 14.3 47.6" fill="none" stroke="#ffffff" stroke-opacity="0.56" stroke-width="0.9" stroke-linecap="round" />

