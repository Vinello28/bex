      <stop offset="14%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="56%" stop-color="#f59e0b" />
      <stop offset="84%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#6c2708" />
